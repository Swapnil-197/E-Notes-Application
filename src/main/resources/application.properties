spring.application.name=E_NotesApplication

spring.datasource.url=jdbc:mysql://localhost:3306/e_notes_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hiebernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernare.dialect=org.hibenate.dialect.MySQL8Dialect
